<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dll315 · 项目导航</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --bg:#0b0b12; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.1); --txt:#e8e8f0; --dim:#9a9ab0; --acc:#ff5f9e; }
  body { font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; }
  .glow { position:fixed; border-radius:50%; filter:blur(90px); opacity:.35; pointer-events:none; z-index:0; }
  .g1 { width:420px; height:420px; background:#ff2d78; top:-120px; left:-120px; }
  .g2 { width:380px; height:380px; background:#5f4bff; bottom:-100px; right:-100px; }
  .wrap { position:relative; z-index:1; max-width:960px; margin:0 auto; padding:48px 20px 60px; }
  header { display:flex; align-items:center; gap:18px; margin-bottom:36px; }
  header img { width:72px; height:72px; border-radius:50%; border:2px solid var(--line); }
  header h1 { font-size:26px; letter-spacing:.5px; }
  header h1 b { color:var(--acc); }
  header p { color:var(--dim); font-size:14px; margin-top:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .card { display:block; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px;
          text-decoration:none; color:var(--txt); transition:transform .18s, border-color .18s, background .18s; }
  .card:hover { transform:translateY(-3px); border-color:var(--acc); background:rgba(255,255,255,.09); }
  .card h2 { font-size:16px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card h2 .arrow { color:var(--dim); font-weight:400; transition:transform .18s; }
  .card:hover h2 .arrow { transform:translateX(3px); color:var(--acc); }
  .card p { color:var(--dim); font-size:13px; line-height:1.55; min-height:40px; display:-webkit-box;
            -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .meta { margin-top:12px; display:flex; gap:10px; align-items:center; font-size:12px; color:var(--dim); }
  .lang { display:inline-flex; align-items:center; gap:5px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--acc); display:inline-block; }
  #state { text-align:center; color:var(--dim); padding:40px 0; font-size:14px; }
  footer { margin-top:40px; text-align:center; color:var(--dim); font-size:12px; }
  footer a { color:var(--dim); }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="wrap">
  <header>
    <img src="https://github.com/dll315.png" alt="avatar" onerror="this.style.display='none'">
    <div>
      <h1><b>dll315</b> 的项目导航</h1>
      <p>GitHub Pages 作品集 · 点卡片直达站点</p>
    </div>
  </header>
  <div id="state">正在加载项目列表…</div>
  <div class="grid" id="grid"></div>
  <footer>
    © <span id="yr"></span> dll315 · <a href="https://github.com/dll315" rel="noopener">GitHub</a> · Powered by GitHub Pages
  </footer>
</div>
<script>
(function () {
  document.getElementById("yr").textContent = new Date().getFullYear();
  var grid = document.getElementById("grid"), state = document.getElementById("state");
  var LANG_COLOR = { HTML:"#e34c26", JavaScript:"#f1e05a", CSS:"#563d7c", Python:"#3572A5", TypeScript:"#2b7489", Vue:"#41b883" };
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
  fetch("https://api.github.com/users/dll315/repos?per_page=100&sort=pushed", { headers: { "Accept": "application/vnd.github+json" } })
    .then(function (r) { if (!r.ok) throw new Error("api " + r.status); return r.json(); })
    .then(function (repos) {
      var sites = repos.filter(function (x) { return x.has_pages && x.name !== "dll315.github.io"; });
      if (!sites.length) { state.textContent = "暂时没有公开的 Pages 站点"; return; }
      state.style.display = "none";
      grid.innerHTML = sites.map(function (x) {
        var url = "https://dll315.github.io/" + x.name + "/";
        var lang = x.language || "";
        var color = LANG_COLOR[lang] || "#8b8bd0";
        return '<a class="card" href="' + url + '" rel="noopener">' +
          '<h2>' + esc(x.name) + '<span class="arrow">→</span></h2>' +
          '<p>' + esc(x.description || "这个项目还没有写简介") + '</p>' +
          '<div class="meta">' +
            (lang ? '<span class="lang"><i class="dot" style="background:' + color + '"></i>' + esc(lang) + '</span>' : '') +
            '<span>★ ' + x.stargazers_count + '</span>' +
            '<span>更新 ' + String(x.pushed_at || "").slice(0, 10) + '</span>' +
          '</div></a>';
      }).join("");
    })
    .catch(function (e) { state.textContent = "项目列表加载失败（GitHub API 限流或网络问题），请稍后再来 · " + e.message; });
})();
</script>
</body>
</html>
